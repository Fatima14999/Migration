name: Migration_Git/Terraform
on:
  push:
    branches:
    - main
env:
  azureSubscription: AzureServiceConnection
  pythonVersion: '3.11'
  webAppName: azure-webapp
jobs:
  Infrastructure-TerraformJob:
    name: Terraform Tasks
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - uses: actions/checkout@v4.1.0
    - name: Install Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: latest
    - name: Terraform Init and Validate
      run: |-
        terraform init
        terraform validate
      working-directory: "${{ github.workspace }}"
  Build-BuildJob:
    name: Install and Package Python App
    needs:
    - Infrastructure-TerraformJob
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - uses: actions/checkout@v4.1.0
    - name: Use Python ${{ env.pythonVersion }}
      uses: actions/setup-python@v5.0.0
      with:
        python-version: "${{ env.pythonVersion }}"
    - name: Install dependencies
      run: |-
        python -m pip install --upgrade pip
        pip install -r my-repo/requirements.txt
    - name: Run unit tests
      run: pytest my-repo/test_app.py --junitxml=test-results.xml
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2.12.0
      if: always()
      with:
        comment_title: Python Tests
        junit_files: test-results.xml
    - name: Zip files
      run: 7z u ${{ runner.temp }}/app.zip ./${{ github.workspace }}/*
    - name: Publish artifact
      uses: actions/upload-artifact@v4.1.0
      with:
        name: drop
        path: "${{ runner.temp }}"
  Deploy-DeployJob:
    name: Deploy Python App
    needs:
    - Build-BuildJob
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: Download artifact
      uses: actions/download-artifact@v4.1.0
      with:
        name: drop
        path: "${{ github.workspace }}"
    - name: Deploy to Azure Web App
      uses: azure/login@v1.6.0
      with:
        creds: "${{ secrets.AZURE_CREDENTIALS }}"
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3.0.0
      with:
        app-name: "${{ env.webAppName }}"
        package: "${{ github.workspace }}/drop/app.zip"
        startup-command: gunicorn --bind=0.0.0.0:8000 app:app
