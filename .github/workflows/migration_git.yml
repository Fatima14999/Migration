name: Migration_Git/Migration_Git
on:
  push:
    branches:
    - main
env:
  AZURE_WEBAPP_NAME: azure-webapp
  DOCKER_HUB_USERNAME: fatimamustafaoo
  IMAGE_NAME: hello-world-python
  IMAGE_TAG: "${{ github.run_id }}"
jobs:
  Build-DockerBuildPush:
    env:
      DOCKERHUBSERVICECONNECTION_DOCKER_USERNAME: fatimamustafaoo
    name: Docker Build & Push
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: Login to Docker Hub
      uses: docker/login-action@v3.0.0
      with:
        username: "${{ env.DOCKERHUBSERVICECONNECTION_DOCKER_USERNAME }}"
        password: "${{ secrets.DOCKERHUBSERVICECONNECTION_DOCKER_PASSWORD }}"
    - name: Build Docker Image
      run: docker build my-python-app --file "/Dockerfile" -t ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -t ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
    - name: Push to Docker Hub
      run: docker push ${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
  Deploy-DeployToAzure:
    name: Deploy Container to Azure
    needs:
    - Build-DockerBuildPush
    runs-on: ubuntu-latest
    if: success()
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: Deploy to Azure Web App
      uses: azure/login@v1.6.0
      with:
        creds: "${{ secrets.AZURE_CREDENTIALS }}"
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3.0.0
      with:
        app-name: "${{ env.AZURE_WEBAPP_NAME }}"
        images: "${{ env.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
